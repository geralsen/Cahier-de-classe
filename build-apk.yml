name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java (nécessaire pour Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install

      - name: Ajouter la plateforme Android
        run: npx cap add android

      - name: Synchroniser le projet Android
        run: npx cap sync android

      - name: Construire l'APK (debug)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Publier l'APK comme résultat du build
        uses: actions/upload-artifact@v4
        with:
          name: cahier-de-classe-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
