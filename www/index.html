<style>
  :root {
    --paper: #EFE6D3;
    --panel: #FAF5E9;
    --panel-2: #F3EBD9;
    --ink: #2A2E27;
    --ink-soft: #6B6656;
    --rule: #CDBE9C;
    --rule-strong: #B7A67D;
    --red: #A8402F;
    --red-soft: #F1DCD3;
    --green: #3F6B45;
    --green-soft: #DEE8D9;
    --amber: #A9781F;
    --amber-soft: #F1E3C5;
    --blue: #33506A;
    --blue-soft: #DCE4E9;
    --shadow: rgba(42,46,39,0.14);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1E1C16;
      --panel: #29261E;
      --panel-2: #322E23;
      --ink: #EDE6D5;
      --ink-soft: #A79E89;
      --rule: #4A4433;
      --rule-strong: #5C5540;
      --red: #E08571;
      --red-soft: #3D2620;
      --green: #8FBB8E;
      --green-soft: #253424;
      --amber: #D9AE5C;
      --amber-soft: #3A2F19;
      --blue: #8FB0C9;
      --blue-soft: #1F2C36;
      --shadow: rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    --paper: #1E1C16;
    --panel: #29261E;
    --panel-2: #322E23;
    --ink: #EDE6D5;
    --ink-soft: #A79E89;
    --rule: #4A4433;
    --rule-strong: #5C5540;
    --red: #E08571;
    --red-soft: #3D2620;
    --green: #8FBB8E;
    --green-soft: #253424;
    --amber: #D9AE5C;
    --amber-soft: #3A2F19;
    --blue: #8FB0C9;
    --blue-soft: #1F2C36;
    --shadow: rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  #app { min-height: 100%; max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; }

  header.topbar {
    padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 12px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    border-bottom: 1px solid var(--rule);
  }
  header.topbar h1 {
    font-family: 'Lora', serif; font-weight: 700; font-size: 21px; margin: 0;
    letter-spacing: 0.2px;
  }
  header.topbar .sub { font-size: 12.5px; color: var(--ink-soft); }

  .class-rail {
    display: flex; gap: 8px; overflow-x: auto; padding: 12px 18px;
    border-bottom: 1px solid var(--rule);
    scrollbar-width: none;
  }
  .class-rail::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; padding: 7px 14px; border-radius: 999px;
    border: 1px solid var(--rule-strong); background: var(--panel);
    color: var(--ink); font-size: 13.5px; font-weight: 500; cursor: pointer;
    white-space: nowrap;
  }
  .chip.active { background: var(--blue); border-color: var(--blue); color: var(--panel); }
  .chip.add { background: transparent; border-style: dashed; color: var(--ink-soft); }

  nav.tabs {
    display: flex; gap: 2px; overflow-x: auto; padding: 10px 18px 0;
    scrollbar-width: none;
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button {
    flex: 0 0 auto; padding: 9px 13px; border: none; background: none;
    color: var(--ink-soft); font-family: inherit; font-size: 13.5px; font-weight: 500;
    cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  nav.tabs button.active { color: var(--ink); border-bottom-color: var(--red); font-weight: 600; }

  main { flex: 1; padding: 14px 18px 40px; overflow-x: hidden; }

  .empty {
    text-align: center; padding: 44px 20px; color: var(--ink-soft);
  }
  .empty .big { font-family: 'Lora', serif; font-size: 17px; color: var(--ink); margin-bottom: 6px; }
  .empty button { margin-top: 14px; }

  .toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-bottom: 12px; flex-wrap: wrap;
  }
  .toolbar .count { font-size: 12.5px; color: var(--ink-soft); }

  button {
    font-family: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--rule-strong);
    background: var(--panel); color: var(--ink); padding: 8px 13px; font-size: 13.5px; font-weight: 500;
  }
  button.primary { background: var(--blue); border-color: var(--blue); color: var(--panel); }
  button.danger-text { border: none; background: none; color: var(--red); padding: 6px 8px; }
  button.ghost { border: none; background: none; color: var(--ink-soft); }
  button.icon-btn { padding: 6px 10px; }
  button:disabled { opacity: 0.45; cursor: default; }
  input[type=text], input[type=date], input[type=number], textarea, select {
    font-family: inherit; font-size: 14px; color: var(--ink); background: var(--panel);
    border: 1px solid var(--rule-strong); border-radius: 8px; padding: 9px 11px; width: 100%;
  }
  textarea { min-height: 92px; resize: vertical; }
  label.field { display: block; margin-bottom: 12px; }
  label.field .lbl { display: block; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 5px; }

  .card {
    background: var(--panel); border: 1px solid var(--rule); border-radius: 10px;
    padding: 14px; margin-bottom: 12px;
  }

  .roster { border-top: 1px solid var(--rule); }
  .row {
    display: flex; align-items: center; gap: 11px; padding: 10px 0;
    border-bottom: 1px solid var(--rule);
  }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: 0 0 auto;
    background: var(--panel-2); border: 1px solid var(--rule-strong);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Lora', serif; font-weight: 600; font-size: 14px; color: var(--ink-soft);
    overflow: hidden; cursor: pointer; position: relative;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .row .name { flex: 1; min-width: 0; font-size: 14.5px; }
  .row .name .points-tag {
    display: block; font-size: 11.5px; color: var(--ink-soft); margin-top: 1px;
  }
  .row .actions { display: flex; gap: 6px; flex: 0 0 auto; }

  .seg { display: flex; border: 1px solid var(--rule-strong); border-radius: 8px; overflow: hidden; }
  .seg button {
    border: none; border-radius: 0; background: var(--panel); padding: 7px 10px; font-size: 12.5px;
    border-right: 1px solid var(--rule-strong);
  }
  .seg button:last-child { border-right: none; }
  .seg button.on-present { background: var(--green-soft); color: var(--green); font-weight: 600; }
  .seg button.on-absent { background: var(--red-soft); color: var(--red); font-weight: 600; }
  .seg button.on-retard { background: var(--amber-soft); color: var(--amber); font-weight: 600; }

  .toggle-hw {
    width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--rule-strong);
    background: var(--panel); display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .toggle-hw.done { background: var(--green-soft); border-color: var(--green); color: var(--green); }

  .pt-btn { width: 30px; height: 30px; border-radius: 8px; font-size: 15px; padding: 0; line-height: 1; }
  .pt-btn.plus { color: var(--green); border-color: var(--green); }
  .pt-btn.minus { color: var(--red); border-color: var(--red); }
  .pt-balance { min-width: 26px; text-align: center; font-weight: 600; font-size: 13.5px; }
  .pt-balance.pos { color: var(--green); }
  .pt-balance.neg { color: var(--red); }

  .eval-item {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 11px 0; border-bottom: 1px solid var(--rule); cursor: pointer;
  }
  .eval-item .t { font-size: 14.5px; }
  .eval-item .d { font-size: 12px; color: var(--ink-soft); }

  .score-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--rule); }
  .score-row .name { flex: 1; font-size: 14px; }
  .score-row input[type=number] { width: 66px; text-align: center; }
  .bonus-badge { font-size: 11.5px; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  .bonus-badge.pos { background: var(--green-soft); color: var(--green); }
  .bonus-badge.neg { background: var(--red-soft); color: var(--red); }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(20,18,12,0.42); display: flex; align-items: flex-end;
    justify-content: center; z-index: 50;
  }
  .modal {
    background: var(--paper); width: 100%; max-width: 720px; border-radius: 16px 16px 0 0;
    padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px)); max-height: 86vh; overflow-y: auto;
    box-shadow: 0 -8px 30px var(--shadow);
  }
  .modal h2 { font-family: 'Lora', serif; font-size: 18px; margin: 0 0 14px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }

  .banner {
    background: var(--amber-soft); color: var(--amber); border: 1px solid var(--amber);
    border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px;
  }
  .hidden { display: none !important; }
  input[type=file] { display: none; }

  .install-btn {
    border: 1px solid var(--blue); color: var(--blue); background: transparent;
    padding: 6px 11px; font-size: 12.5px; border-radius: 999px; white-space: nowrap;
  }
  .install-btn[hidden] { display: none; }
  .ios-banner {
    margin: 0 18px 10px; background: var(--panel-2); border: 1px solid var(--rule);
    border-radius: 10px; padding: 10px 12px; font-size: 12.5px; color: var(--ink-soft);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .ios-banner button.ghost { padding: 2px 6px; font-size: 16px; color: var(--ink-soft); }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  // ---------- local, on-device storage (IndexedDB) ----------
  const DB_NAME = 'cahier-de-classe';
  const DB_VERSION = 1;
  let idb = null;

  function openLocalDb(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('classes')) d.createObjectStore('classes', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('students')) {
          const s = d.createObjectStore('students', { keyPath: 'id' });
          s.createIndex('classId', 'classId');
        }
        if (!d.objectStoreNames.contains('attendance')) d.createObjectStore('attendance', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('homework')) d.createObjectStore('homework', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('points_log')) d.createObjectStore('points_log', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('grades')) {
          const g = d.createObjectStore('grades', { keyPath: 'id' });
          g.createIndex('classId', 'classId');
        }
        if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos', { keyPath: 'id' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function tx(storeName, mode){
    return idb.transaction(storeName, mode).objectStore(storeName);
  }
  function reqToPromise(req){
    return new Promise((resolve, reject) => {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  function idbGetAll(storeName){
    return reqToPromise(tx(storeName, 'readonly').getAll());
  }
  function idbGetAllByIndex(storeName, indexName, value){
    return reqToPromise(tx(storeName, 'readonly').index(indexName).getAll(value));
  }
  function idbGet(storeName, key){
    return reqToPromise(tx(storeName, 'readonly').get(key));
  }
  function idbPut(storeName, value){
    return reqToPromise(tx(storeName, 'readwrite').put(value));
  }
  function idbDelete(storeName, key){
    return reqToPromise(tx(storeName, 'readwrite').delete(key));
  }
  function newId(){
    if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
    return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
  }

  let ready = false;
  let classes = [];
  let currentClassId = null;
  let currentTab = 'eleves';
  let students = [];
  let currentDate = todayStr();
  let attendanceDoc = { records: {} };
  let homeworkDoc = { records: {} };
  let evaluations = [];
  let openEvalId = null;
  let newEvalDraft = null; // {name, date, maxScore, scores:{studentId:base}}
  let photoUrlCache = new Map(); // photoId -> object URL

  function todayStr(){
    const d = new Date();
    const pad = n => String(n).padStart(2,'0');
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  function fmtDate(s){
    const [y,m,d] = s.split('-');
    return d+'/'+m+'/'+y;
  }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function initials(name){
    const parts = (name||'').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    if (parts.length===1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
  }
  function attId(){ return currentClassId+'_'+currentDate; }
  function currentClass(){ return classes.find(c=>c.id===currentClassId) || null; }

  async function init(){
    try {
      idb = await openLocalDb();
      ready = true;
    } catch(e){
      ready = false;
    }
    render();
    if (ready) {
      await loadClasses();
      if (classes.length && !currentClassId) currentClassId = classes[0].id;
      if (currentClassId) await loadClassData();
      render();
    }
  }

  async function loadClasses(){
    classes = await idbGetAll('classes');
    classes.sort((a,b) => (a.name||'').localeCompare(b.name||'', 'fr'));
  }

  async function loadClassData(){
    await loadStudents();
    if (currentTab === 'appel') await loadAttendance();
    if (currentTab === 'devoirs') await loadHomework();
    if (currentTab === 'notes') await loadEvaluations();
  }

  async function loadStudents(){
    if (!currentClassId) { students = []; return; }
    students = await idbGetAllByIndex('students', 'classId', currentClassId);
    students.sort((a,b) => (a.name||'').localeCompare(b.name||'', 'fr'));
    await warmPhotoCache();
  }

  async function warmPhotoCache(){
    const needed = students.filter(s => s.photoId && !photoUrlCache.has(s.photoId));
    for (const s of needed) {
      try {
        const rec = await idbGet('photos', s.photoId);
        if (rec && rec.blob) {
          photoUrlCache.set(s.photoId, URL.createObjectURL(rec.blob));
        }
      } catch(e) { /* ignore */ }
    }
  }

  async function loadAttendance(){
    if (!currentClassId) { attendanceDoc = {records:{}}; return; }
    const rec = await idbGet('attendance', attId());
    attendanceDoc = rec || { id: attId(), classId: currentClassId, date: currentDate, records: {} };
    if (!attendanceDoc.records) attendanceDoc.records = {};
  }

  async function loadHomework(){
    if (!currentClassId) { homeworkDoc = {records:{}}; return; }
    const rec = await idbGet('homework', attId());
    homeworkDoc = rec || { id: attId(), classId: currentClassId, date: currentDate, records: {} };
    if (!homeworkDoc.records) homeworkDoc.records = {};
  }

  async function loadEvaluations(){
    if (!currentClassId) { evaluations = []; return; }
    evaluations = await idbGetAllByIndex('grades', 'classId', currentClassId).catch(() => []);
    if (!evaluations) evaluations = [];
    evaluations.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  }

  // ---------- actions ----------

  async function selectClass(id){
    currentClassId = id;
    openEvalId = null; newEvalDraft = null;
    render();
    await loadClassData();
    render();
  }

  async function selectTab(tab){
    currentTab = tab;
    openEvalId = null; newEvalDraft = null;
    render();
    await loadClassData();
    render();
  }

  async function createClass(){
    const name = prompt('Nom de la classe (ex. 3e A) :');
    if (!name || !name.trim()) return;
    const id = newId();
    await idbPut('classes', { id, name: name.trim(), createdAt: new Date().toISOString() });
    await loadClasses();
    await selectClass(id);
  }

  function openImport(){
    showModal(`
      <h2>Importer une liste d'élèves</h2>
      <label class="field">
        <span class="lbl">Un nom par ligne (copier-coller depuis un tableur)</span>
        <textarea id="import-text" placeholder="Dupont Alice&#10;Martin Noé&#10;..."></textarea>
      </label>
      <div class="modal-actions">
        <button class="ghost" onclick="App.closeModal()">Annuler</button>
        <button class="primary" onclick="App.doImport()">Importer</button>
      </div>
    `);
  }

  async function doImport(){
    const ta = document.getElementById('import-text');
    const lines = (ta.value||'').split('\n').map(l=>l.trim()).filter(Boolean);
    closeModal();
    for (const line of lines) {
      const name = line.split(',').map(s=>s.trim()).filter(Boolean).join(' ');
      await idbPut('students', {
        id: newId(), classId: currentClassId, name, photoId: null, pendingPoints: 0,
        createdAt: new Date().toISOString()
      });
    }
    await loadStudents();
    render();
  }

  function openAddStudent(){
    showModal(`
      <h2>Ajouter un élève</h2>
      <label class="field">
        <span class="lbl">Nom et prénom</span>
        <input id="add-name" type="text" placeholder="Dupont Alice">
      </label>
      <div class="modal-actions">
        <button class="ghost" onclick="App.closeModal()">Annuler</button>
        <button class="primary" onclick="App.doAddStudent()">Ajouter</button>
      </div>
    `);
    setTimeout(()=>{ const el = document.getElementById('add-name'); if(el) el.focus(); }, 30);
  }

  async function doAddStudent(){
    const name = (document.getElementById('add-name').value||'').trim();
    if (!name) return;
    closeModal();
    await idbPut('students', {
      id: newId(), classId: currentClassId, name, photoId: null, pendingPoints: 0,
      createdAt: new Date().toISOString()
    });
    await loadStudents();
    render();
  }

  async function deleteStudent(id){
    if (!confirm("Retirer cet élève de la classe ? Son historique sera conservé mais il n'apparaîtra plus dans les listes.")) return;
    await idbDelete('students', id);
    await loadStudents();
    render();
  }

  function triggerPhotoUpload(studentId){
    const input = document.getElementById('photo-input');
    input.dataset.studentId = studentId;
    input.click();
  }

  async function onPhotoChosen(input){
    const file = input.files && input.files[0];
    const studentId = input.dataset.studentId;
    input.value = '';
    if (!file || !studentId) return;
    try {
      const photoId = newId();
      await idbPut('photos', { id: photoId, blob: file });
      photoUrlCache.set(photoId, URL.createObjectURL(file));
      const student = students.find(s => s.id === studentId);
      const oldPhotoId = student ? student.photoId : null;
      await idbPut('students', { ...student, photoId });
      if (oldPhotoId) { await idbDelete('photos', oldPhotoId).catch(()=>{}); photoUrlCache.delete(oldPhotoId); }
      await loadStudents();
      render();
    } catch(e){
      alert("La photo n'a pas pu être enregistrée sur cet appareil.");
    }
  }

  async function changeDate(newDate){
    currentDate = newDate;
    if (currentTab === 'appel') await loadAttendance();
    if (currentTab === 'devoirs') await loadHomework();
    render();
  }

  async function setAttendance(studentId, status){
    const cur = attendanceDoc.records[studentId];
    if (cur === status) delete attendanceDoc.records[studentId];
    else attendanceDoc.records[studentId] = status;
    render();
    await idbPut('attendance', {
      id: attId(), classId: currentClassId, date: currentDate, records: attendanceDoc.records,
      updatedAt: new Date().toISOString()
    });
  }

  async function markAllPresent(){
    students.forEach(s => attendanceDoc.records[s.id] = 'present');
    render();
    await idbPut('attendance', {
      id: attId(), classId: currentClassId, date: currentDate, records: attendanceDoc.records,
      updatedAt: new Date().toISOString()
    });
  }

  async function toggleHomework(studentId){
    const cur = !!homeworkDoc.records[studentId];
    if (cur) delete homeworkDoc.records[studentId]; else homeworkDoc.records[studentId] = true;
    render();
    await idbPut('homework', {
      id: attId(), classId: currentClassId, date: currentDate, records: homeworkDoc.records,
      updatedAt: new Date().toISOString()
    });
  }

  async function adjustPoints(studentId, delta){
    const s = students.find(x=>x.id===studentId);
    if (!s) return;
    const before = s.pendingPoints || 0;
    s.pendingPoints = before + delta;
    render();
    await idbPut('students', { ...s });
    await idbPut('points_log', {
      id: newId(), classId: currentClassId, studentId, delta,
      reason: delta > 0 ? 'Bon comportement' : 'Comportement à corriger',
      date: todayStr(), createdAt: new Date().toISOString()
    });
  }

  function openNewEval(){
    newEvalDraft = { name:'', date: todayStr(), maxScore: 20, scores: {} };
    render();
  }

  function cancelNewEval(){
    newEvalDraft = null;
    render();
  }

  function updateDraftScore(studentId, val){
    if (!newEvalDraft) return;
    newEvalDraft.scores[studentId] = val;
  }

  async function saveNewEval(){
    const nameEl = document.getElementById('eval-name');
    const dateEl = document.getElementById('eval-date');
    const maxEl = document.getElementById('eval-max');
    const name = (nameEl.value||'').trim();
    const date = dateEl.value || todayStr();
    const maxScore = Number(maxEl.value) || 20;
    if (!name) { alert("Donnez un nom à l'évaluation."); return; }

    const scores = {};
    const toReset = [];
    students.forEach(s => {
      const el = document.getElementById('score-'+s.id);
      const raw = el ? el.value : '';
      if (raw === '' || raw === null) return;
      const base = Number(raw);
      const bonus = s.pendingPoints || 0;
      let final = base + bonus;
      if (final < 0) final = 0;
      if (final > maxScore) final = maxScore;
      scores[s.id] = { base, bonus, final };
      if (bonus !== 0) toReset.push(s.id);
    });

    await idbPut('grades', {
      id: newId(), classId: currentClassId, name, date, maxScore, scores,
      createdAt: new Date().toISOString()
    });

    for (const sid of toReset) {
      const s = students.find(x=>x.id===sid);
      if (s) { s.pendingPoints = 0; await idbPut('students', { ...s }); }
    }

    newEvalDraft = null;
    await loadEvaluations();
    render();
  }

  async function deleteEval(id){
    if (!confirm('Supprimer cette évaluation ?')) return;
    await idbDelete('grades', id);
    openEvalId = null;
    await loadEvaluations();
    render();
  }

  function openEval(id){
    openEvalId = (openEvalId === id) ? null : id;
    render();
  }

  function showModal(html){
    const back = document.createElement('div');
    back.className = 'modal-backdrop';
    back.id = 'modal-backdrop';
    back.onclick = (e) => { if (e.target === back) closeModal(); };
    back.innerHTML = '<div class="modal">'+html+'</div>';
    document.body.appendChild(back);
  }
  function closeModal(){
    const el = document.getElementById('modal-backdrop');
    if (el) el.remove();
  }

  // ---------- render ----------

  function render(){
    const app = document.getElementById('app');
    app.innerHTML = renderTop() + renderClassRail() + renderTabs() + '<main>'+renderMain()+'</main>' +
      '<input type="file" id="photo-input" accept="image/*" onchange="App.onPhotoChosen(this)">';
  }

  function renderTop(){
    return `<header class="topbar">
      <h1>Cahier de classe</h1>
      <span style="display:flex; align-items:center; gap:8px;">
        <button class="install-btn" id="install-btn" hidden onclick="App.doInstall()">Installer l'appli</button>
        <span class="sub">${esc(fmtDate(todayStr()))}</span>
      </span>
    </header>
    ${renderIosBanner()}`;
  }

  let iosBannerDismissed = false;
  function isIos(){
    return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.navigator.standalone;
  }
  function renderIosBanner(){
    if (!isIos() || iosBannerDismissed || window.navigator.standalone) return '';
    return `<div class="ios-banner">
      <span>Pour installer : appuyez sur <strong>Partager</strong> puis <strong>Sur l'écran d'accueil</strong>.</span>
      <button class="ghost" onclick="App.dismissIosBanner()">✕</button>
    </div>`;
  }
  function dismissIosBanner(){ iosBannerDismissed = true; render(); }

  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    const btn = document.getElementById('install-btn');
    if (btn) btn.hidden = false;
  });
  async function doInstall(){
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    const btn = document.getElementById('install-btn');
    if (btn) btn.hidden = true;
  }

  function renderClassRail(){
    if (!ready) return '';
    const chips = classes.map(c => `<button class="chip ${c.id===currentClassId?'active':''}" onclick="App.selectClass('${c.id}')">${esc(c.name)}</button>`).join('');
    return `<div class="class-rail">${chips}<button class="chip add" onclick="App.createClass()">+ Classe</button></div>`;
  }

  function renderTabs(){
    if (!ready || !currentClassId) return '';
    const tabs = [['eleves','Élèves'],['appel','Appel'],['devoirs','Devoirs'],['points','Points'],['notes','Notes']];
    return `<nav class="tabs">${tabs.map(([id,label])=>`<button class="${currentTab===id?'active':''}" onclick="App.selectTab('${id}')">${label}</button>`).join('')}</nav>`;
  }

  function renderMain(){
    if (!ready) {
      return `<div class="banner">Le stockage local de cet appareil n'est pas disponible (mode navigation privée, par exemple). Les données ne pourront pas être enregistrées.</div>`;
    }
    if (!classes.length) {
      return `<div class="empty">
        <div class="big">Aucune classe pour l'instant</div>
        <div>Créez votre première classe pour commencer.</div>
        <button class="primary" onclick="App.createClass()">Créer une classe</button>
      </div>`;
    }
    if (!currentClassId) return '';
    if (currentTab === 'eleves') return renderEleves();
    if (currentTab === 'appel') return renderAppel();
    if (currentTab === 'devoirs') return renderDevoirs();
    if (currentTab === 'points') return renderPoints();
    if (currentTab === 'notes') return renderNotes();
    return '';
  }

  function studentRowStart(s){
    const url = s.photoId ? photoUrlCache.get(s.photoId) : null;
    const img = url ? `<img src="${url}" alt="">` : esc(initials(s.name));
    return `<div class="avatar" onclick="App.triggerPhotoUpload('${s.id}')" title="Changer la photo">${img}</div>`;
  }

  function renderEleves(){
    if (!students.length) {
      return `<div class="empty">
        <div class="big">Aucun élève dans cette classe</div>
        <div>Importez une liste ou ajoutez un élève.</div>
        <div style="margin-top:14px; display:flex; gap:8px; justify-content:center;">
          <button onclick="App.openImport()">Importer une liste</button>
          <button class="primary" onclick="App.openAddStudent()">Ajouter un élève</button>
        </div>
      </div>`;
    }
    const rows = students.map(s => `
      <div class="row">
        ${studentRowStart(s)}
        <div class="name">${esc(s.name)}${(s.pendingPoints||0) !== 0 ? `<span class="points-tag">${s.pendingPoints>0?'+':''}${s.pendingPoints} point(s) en attente</span>` : ''}</div>
        <div class="actions">
          <button class="danger-text" onclick="App.deleteStudent('${s.id}')">Retirer</button>
        </div>
      </div>`).join('');
    return `
      <div class="toolbar">
        <span class="count">${students.length} élève${students.length>1?'s':''}</span>
        <div style="display:flex; gap:8px;">
          <button onclick="App.openImport()">Importer</button>
          <button class="primary" onclick="App.openAddStudent()">+ Élève</button>
        </div>
      </div>
      <div class="roster">${rows}</div>`;
  }

  function renderDateBar(){
    return `<div class="toolbar">
      <input type="date" value="${esc(currentDate)}" onchange="App.changeDate(this.value)" style="width:auto;">
    </div>`;
  }

  function renderAppel(){
    if (!students.length) return `<div class="empty"><div class="big">Aucun élève à faire l'appel</div><div>Ajoutez d'abord des élèves dans l'onglet Élèves.</div></div>`;
    const rows = students.map(s => {
      const st = attendanceDoc.records[s.id];
      return `<div class="row">
        ${studentRowStart(s)}
        <div class="name">${esc(s.name)}</div>
        <div class="seg">
          <button class="${st==='present'?'on-present':''}" onclick="App.setAttendance('${s.id}','present')">P</button>
          <button class="${st==='retard'?'on-retard':''}" onclick="App.setAttendance('${s.id}','retard')">R</button>
          <button class="${st==='absent'?'on-absent':''}" onclick="App.setAttendance('${s.id}','absent')">A</button>
        </div>
      </div>`;
    }).join('');
    return renderDateBar() + `
      <div class="toolbar"><span class="count">P = présent · R = retard · A = absent</span><button onclick="App.markAllPresent()">Tous présents</button></div>
      <div class="roster">${rows}</div>`;
  }

  function renderDevoirs(){
    if (!students.length) return `<div class="empty"><div class="big">Aucun élève</div><div>Ajoutez d'abord des élèves dans l'onglet Élèves.</div></div>`;
    const rows = students.map(s => {
      const done = !!homeworkDoc.records[s.id];
      return `<div class="row">
        ${studentRowStart(s)}
        <div class="name">${esc(s.name)}</div>
        <button class="toggle-hw ${done?'done':''}" onclick="App.toggleHomework('${s.id}')">${done?'✓':''}</button>
      </div>`;
    }).join('');
    return renderDateBar() + `<div class="roster">${rows}</div>`;
  }

  function renderPoints(){
    if (!students.length) return `<div class="empty"><div class="big">Aucun élève</div><div>Ajoutez d'abord des élèves dans l'onglet Élèves.</div></div>`;
    const rows = students.map(s => {
      const p = s.pendingPoints || 0;
      return `<div class="row">
        ${studentRowStart(s)}
        <div class="name">${esc(s.name)}</div>
        <div class="actions">
          <button class="pt-btn minus" onclick="App.adjustPoints('${s.id}',-1)">−</button>
          <span class="pt-balance ${p>0?'pos':(p<0?'neg':'')}">${p>0?'+':''}${p}</span>
          <button class="pt-btn plus" onclick="App.adjustPoints('${s.id}',1)">+</button>
        </div>
      </div>`;
    }).join('');
    return `<div class="banner">Les points ajoutés ici s'appliquent automatiquement au score de la prochaine évaluation créée dans l'onglet Notes.</div>
      <div class="roster">${rows}</div>`;
  }

  function renderNotes(){
    if (newEvalDraft) return renderNewEvalForm();
    if (openEvalId) {
      const ev = evaluations.find(e=>e.id===openEvalId);
      if (ev) return renderEvalDetail(ev);
    }
    const list = evaluations.length ? evaluations.map(e => `
      <div class="eval-item" onclick="App.openEval('${e.id}')">
        <div><div class="t">${esc(e.name)}</div><div class="d">sur ${e.maxScore}</div></div>
        <div class="d">${esc(fmtDate(e.date))}</div>
      </div>`).join('') : `<div class="empty"><div class="big">Aucune évaluation enregistrée</div></div>`;
    return `<div class="toolbar"><span class="count">${evaluations.length} évaluation${evaluations.length>1?'s':''}</span><button class="primary" onclick="App.openNewEval()">+ Évaluation</button></div>${list}`;
  }

  function renderNewEvalForm(){
    if (!students.length) {
      return `<div class="empty"><div class="big">Ajoutez des élèves avant de créer une évaluation</div></div>`;
    }
    const rows = students.map(s => {
      const bonus = s.pendingPoints || 0;
      return `<div class="score-row">
        <div class="name">${esc(s.name)} ${bonus!==0?`<span class="bonus-badge ${bonus>0?'pos':'neg'}">${bonus>0?'+':''}${bonus}</span>`:''}</div>
        <input type="number" id="score-${s.id}" placeholder="—" step="0.5" oninput="App.updateDraftScore('${s.id}', this.value)">
      </div>`;
    }).join('');
    return `
      <h2 style="font-family:'Lora',serif; font-size:17px; margin:2px 0 12px;">Nouvelle évaluation</h2>
      <label class="field"><span class="lbl">Intitulé</span><input id="eval-name" type="text" placeholder="Contrôle chapitre 3"></label>
      <div style="display:flex; gap:10px;">
        <label class="field" style="flex:1;"><span class="lbl">Date</span><input id="eval-date" type="date" value="${esc(newEvalDraft.date)}"></label>
        <label class="field" style="flex:1;"><span class="lbl">Barème</span><input id="eval-max" type="number" value="${esc(newEvalDraft.maxScore)}"></label>
      </div>
      <div class="banner">Le point en attente de chaque élève sera ajouté à sa note, puis remis à zéro.</div>
      <div class="roster" style="margin-bottom:14px;">${rows}</div>
      <div class="modal-actions">
        <button class="ghost" onclick="App.cancelNewEval()">Annuler</button>
        <button class="primary" onclick="App.saveNewEval()">Enregistrer</button>
      </div>`;
  }

  function renderEvalDetail(ev){
    const rows = students.map(s => {
      const sc = ev.scores[s.id];
      if (!sc) return `<div class="score-row"><div class="name">${esc(s.name)}</div><span class="d">—</span></div>`;
      return `<div class="score-row">
        <div class="name">${esc(s.name)}${sc.bonus?` <span class="bonus-badge ${sc.bonus>0?'pos':'neg'}">${sc.bonus>0?'+':''}${sc.bonus}</span>`:''}</div>
        <strong>${sc.final} / ${ev.maxScore}</strong>
      </div>`;
    }).join('');
    return `
      <div class="toolbar">
        <button class="ghost" onclick="App.openEval('${ev.id}')">← Retour</button>
        <button class="danger-text" onclick="App.deleteEval('${ev.id}')">Supprimer</button>
      </div>
      <h2 style="font-family:'Lora',serif; font-size:17px; margin:2px 0 4px;">${esc(ev.name)}</h2>
      <div class="d" style="color:var(--ink-soft); margin-bottom:12px;">${esc(fmtDate(ev.date))} · sur ${ev.maxScore}</div>
      <div class="roster">${rows}</div>`;
  }

  window.App = {
    selectClass, selectTab, createClass, openImport, doImport, openAddStudent, doAddStudent,
    deleteStudent, triggerPhotoUpload, onPhotoChosen, changeDate, setAttendance, markAllPresent,
    toggleHomework, adjustPoints, openNewEval, cancelNewEval, updateDraftScore, saveNewEval,
    deleteEval, openEval, closeModal, doInstall, dismissIosBanner
  };

  init();
})();

</script>
</body>
</html>
